<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>YutuGs-Photo 正在启动</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:transparent}
body{position:relative;user-select:none;-webkit-user-select:none}
.splash-art{position:absolute;inset:0;width:100%;height:100%;object-fit:fill;display:block;-webkit-user-drag:none}
.status-cover{position:absolute;left:3.85%;top:56.65%;width:23%;height:8.4%;
 background:linear-gradient(90deg,rgba(0,12,34,.98) 0%,rgba(0,12,34,.96) 78%,rgba(0,12,34,0) 100%);
 display:flex;align-items:center;padding-left:0.75%;}
.status{font-family:"Microsoft YaHei","Noto Sans CJK SC",sans-serif;font-size:clamp(12px,1.88vw,15px);
 line-height:1;color:#f3f7ff;white-space:nowrap;text-shadow:0 1px 3px #00102b;letter-spacing:.1px}
.dot{display:inline-block;opacity:.18;animation:dotGlow 1.15s infinite ease-in-out;}
.dot:nth-child(1){animation-delay:0s}.dot:nth-child(2){animation-delay:.14s}.dot:nth-child(3){animation-delay:.28s}.dot:nth-child(4){animation-delay:.42s}.dot:nth-child(5){animation-delay:.56s}
@keyframes dotGlow{0%,60%,100%{opacity:.2;transform:translateY(0)}30%{opacity:1;transform:translateY(-1px)}}
@media(prefers-reduced-motion:reduce){.dot{animation:none;opacity:1}}
</style>
</head>
<body>
<img class="splash-art" src="/yutugs-photo-splash.png" alt="YutuGs-Photo 启动画面">
<div class="status-cover" aria-live="polite"><div class="status">正在初始化<span class="dot">.</span><span class="dot">.</span><span class="dot">.</span><span class="dot">.</span><span class="dot">.</span></div></div>
</body></html>
